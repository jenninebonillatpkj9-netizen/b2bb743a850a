version: 2.1

jobs:
  miqp_branch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write MIQP
          command: |
            printf 'int x\n' > miqp.txt
      - run:
          name: Build branch-and-bound
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target miqp_branch -j2
      - run:
          name: Branch MIQP nodes
          command: LIONSS_LP=1 ./build/miqp_branch --in miqp.txt --gap 0.01
  zerolog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set sink
          command: |
            printf 'out=stderr\n' > log.conf
      - run:
          name: Build zero-alloc logger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zerolog -j2
      - run:
          name: Measure allocation rate
          command: LIONSS_LP=1 ./build/zerolog --conf log.conf --events 2000000
  msp430lpm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set LPM mode
          command: |
            printf 'mode=lpm3\n' > lpm.cfg
      - run:
          name: Build power manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target msp430lpm -j2
      - run:
          name: Enter low-power mode
          command: LIONSS_LP=1 ./build/msp430lpm --conf lpm.cfg --wake rtc
  joinReorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
